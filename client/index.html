    <!-- Immediate Discovery Preload for Hero Banner (LCP Optimization) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem("trend_salon_banners_v1");
          var banner = raw ? JSON.parse(raw) : null;
          var isMobile = window.innerWidth < 768;
          var imgUrl = "";
          if (banner && banner.home) {
            imgUrl = (isMobile && banner.home.mobileImage) ? banner.home.mobileImage : banner.home.image;
          }
          if (!imgUrl) {
            imgUrl = "/uploads/others/1st__2_-1794658282338-316370876.png";
          }
          if (imgUrl) {
            var fullUrl = imgUrl.indexOf("http") === 0 ? imgUrl : ("https://api.trendcosmetica.com" + imgUrl);
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.href = fullUrl;
            link.fetchPriority = "high";
            document.head.appendChild(link);
          }
        } catch(e) {}
      })();
    </script>




<!-- Internal-page guard.
     This shell is served for every path, admin routes included, so each
     marketing/analytics tag below has to opt out of the staff pages itself.
     Without it the admin URLs (and the record ids in them) are reported to
     GTM/GA4, staff sessions pollute the reports, and Clarity records replays
     of order and customer screens. -->
<script>
  window.dataLayer = window.dataLayer || []
  window.__grabatozInternalPage = (function () {
    try {
      return /^\/(admin|superadmin|grabiansadmin|grabiansuperadmin)(\/|$)/.test(
        (window.location.pathname || "").toLowerCase()
      )
    } catch (e) {
      return false
    }
  })()
</script>

<!-- Saved theme, applied before first paint.
     ThemeProvider caches the admin's palette as ready-made CSS text, so the
     first frame is already themed instead of flashing the shipped colours and
     then swapping. The runtime provider re-applies (and resolves any per-page
     rule) the moment React mounts, and its inline styles on <html> win over
     this block -- so a stale cache is corrected, never stuck.

     Skipped on staff pages: /admin keeps the shipped palette, always. -->
<script>
  (function () {
    try {
      if (window.__grabatozInternalPage) return
      var css = window.localStorage.getItem("grabatoz-theme-css-v1")
      if (!css) return
      var style = document.createElement("style")
      style.id = "grabatoz-theme-preload"
      style.textContent = ":root{" + css + "}"
      document.head.appendChild(style)
    } catch (e) {
      /* No storage, or a malformed cache: the stylesheet defaults stand. */
    }
  })()
</script>

    <!-- Defer non-critical third-party scripts (GTM, Meta Pixel, Clarity, ClickCease) to protect Core Web Vitals (TBT/FCP/LCP) -->

            s.parentNode.insertBefore(t,s)}(window, document,'script',

            if (window.fbq) {

          // 3. ClickCease

          // 4. Microsoft Clarity
          try {

          // 5. Google Customer Reviews Merchant Widget

            var merchantScript = appendScript(
              "https://www.gstatic.com/shopping/merchant/merchantwidget.js",
              "merchantWidgetScript"
            )
            merchantScript.addEventListener("load", function () {
              if (window.merchantwidget && typeof window.merchantwidget.start === "function") {

                  merchant_id: 5694261680,
                  position: "RIGHT_BOTTOM",

          } catch(e) {}
        }

        // Load third-party trackers only after first user interaction or when idle
        ;["pointerdown", "keydown", "touchstart", "scroll"].forEach(function (eventName) {
          window.addEventListener(eventName, loadThirdParty, { once: true, passive: true })
        })

        if ("requestIdleCallback" in window) {
          requestIdleCallback(function () {
            setTimeout(loadThirdParty, 5000)
          })
        } else {
          setTimeout(loadThirdParty, 5000)
        }
      })()
